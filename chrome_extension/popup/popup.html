<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Resume Tailor Autofill</title>
  <style>
    body {
      width: 280px;
      padding: 12px;
      font-family: system-ui, sans-serif;
      font-size: 13px;
    }
    h2 {
      margin: 0 0 10px;
      font-size: 14px;
    }
    .status {
      padding: 6px 8px;
      border-radius: 4px;
      margin-bottom: 10px;
      font-size: 12px;
    }
    .status.ok { background: #e8f5e9; color: #2e7d32; }
    .status.error { background: #ffebee; color: #c62828; }
    .status.loading { background: #e3f2fd; color: #1565c0; }
    label { display: block; margin-bottom: 4px; }
    select {
      width: 100%;
      padding: 6px 8px;
      margin-bottom: 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    button {
      padding: 6px 12px;
      background: #1976d2;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
    }
    button:disabled { background: #9e9e9e; cursor: not-allowed; }
    button.secondary { background: #757575; }
    .saved { font-size: 11px; color: #2e7d32; margin-top: 6px; }
  </style>
</head>
<body>
  <h2>Resume Tailor Autofill</h2>
  <div id="status" class="status loading">Checking server…</div>
  <div id="profileSection" style="display: none;">
    <label for="profile">Profile</label>
    <select id="profile">
      <option value="">-- Select profile --</option>
    </select>
    <button id="save">Save</button>
    <div id="saved" class="saved" style="display: none;">Profile saved.</div>
  </div>
  <script src="../lib/storage.js"></script>
  <script src="popup.js"></script>
</body>
</html>
